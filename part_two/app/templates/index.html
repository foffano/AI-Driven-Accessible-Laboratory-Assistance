<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Lab Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern_styles.css') }}">
</head>

<body>
    <div class="app-container">
        <!-- Main Video Feed -->
        <div class="main-content">
            <div class="video-wrapper">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
        </div>

        <!-- Sidebar with Info and Controls -->
        <div class="sidebar">
            <!-- Text/Chat Panel -->
            <div class="info-panel">
                <div class="panel-header" id="panel-header">Assistant Response</div>
                <div class="text-container" id="text-container">
                    <!-- Messages will appear here -->
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-wrapper">
                <button id="analyze-button" onclick="analyze()">
                    <span>🔍 Analyze</span>
                </button>
                <button id="control-button" onclick="toggleApp()">
                    <span>⏹ Stop</span>
                </button>
                <button id="settings-button" onclick="openSettings()">
                    <span>⚙️ Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeSettings()">&times;</span>
            <h2 id="settings-title">Settings</h2>

            <label for="api-key" id="api-key-label">API Key:</label>
            <input type="password" id="api-key" placeholder="Enter OpenRouter API Key">

            <label for="model" id="model-label">Model:</label>
            <input type="text" id="model" placeholder="google/gemini-2.0-flash-exp:free">

            <label for="prompt" id="prompt-label">Prompt:</label>
            <textarea id="prompt" rows="4" placeholder="Enter system prompt..."></textarea>

            <label for="language" id="language-label">Language:</label>
            <select id="language" style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; background-color: #333; color: white;">
                <option value="en">English</option>
                <option value="pt">Português</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
            </select>

            <div class="modal-actions">
                <button onclick="saveSettings()" style="background: var(--primary-color); border: none;">Save</button>
                <button onclick="closeSettings()" style="background: rgba(255, 255, 255, 0.1);">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
